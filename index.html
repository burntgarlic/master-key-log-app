<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Blocking (no `type="module"`, no `defer`) and placed before any
         stylesheet so it runs before first paint — sets data-theme from a
         saved explicit choice before CSS ever resolves color tokens, which
         is what avoids a flash of the wrong theme on load. "System" mode
         (the default) deliberately sets nothing here: index.css's bare
         :root + prefers-color-scheme media query already track the OS
         preference with pure CSS, so there's nothing to flash in that case
         either. Must stay in sync with src/lib/theme.js — same key,
         same 'light'/'dark'-only convention. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mk_theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14151a" />
    <meta name="description" content="A daily practice companion for the 26-week Master Key attention curriculum." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- iOS ignores SVG for apple-touch-icon entirely (same class of bug as
         the notification icon) — this one needs a real PNG. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Master Key</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
